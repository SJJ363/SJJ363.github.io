name: Refresh insurtech news

on:
  schedule:
    # A few times a day — every 6 hours (UTC). GitHub may delay runs under load.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Fetch latest news
        run: node scripts/fetch-news.js

      # Install the Claude CLI once (used by both company extraction and the
      # brief). Authenticated by a Claude subscription via the OAuth token —
      # no metered API key. Skipped cleanly when the secret isn't set.
      - name: Install Claude CLI
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN secret set — Claude steps will fall back."
          else
            npm install -g @anthropic-ai/claude-code
          fi

      # The brief runs FIRST, before company extraction, because the two share
      # one subscription budget and only one of them is original writing. On
      # 2026-07-26 the extractor spent the last of the session quota one second
      # before the brief asked for it; the brief now gets first claim, and the
      # extractor degrades to heuristics — which nobody reads as prose.
      #
      # Fail-safe by design: the script walks a ladder (CLI → other models →
      # wait out a short limit → the metered API → today's earlier Claude
      # brief) and only then keeps the deterministic one, stamping a
      # retryAfter that brief-retry.yml picks up.
      - name: Write brief with Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Separate quota from the subscription — the rung that survives a
          # session limit. Optional; the ladder just ends a step earlier without it.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No Claude credentials set — keeping deterministic brief."
            exit 0
          fi
          node scripts/write-brief.js || echo "Brief writer crashed — keeping deterministic brief."

      # Extract companies with Claude (heuristic fallback), tag each article,
      # and update the persistent company index (accumulates across batches).
      - name: Update company index
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/companies.js || echo "Company index step failed — keeping previous."

      # Only exists when the enhancement fell back. Holds the raw model reply
      # and the guard that rejected it — the evidence that shouldn't ship to
      # the site. The short reason code is also committed into news.json.
      - name: Upload brief fallback diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: brief-fallback-${{ github.run_number }}
          path: brief-fallback.json
          if-no-files-found: ignore
          retention-days: 30

      # Regenerate all SEO artifacts from the refreshed data: static
      # per-company pages, the day's brief page (folded into the
      # permanent archive under /brief/), sitemap.xml, robots.txt, and
      # the structured data injected into index.html / companies.html.
      - name: Build SEO (pages, sitemap, structured data)
        run: node scripts/seo.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ company/ brief/ topic/ sitemap.xml robots.txt index.html companies.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh insurtech news ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
            echo "News + SEO updated and pushed."
          else
            echo "No changes to publish."
          fi
