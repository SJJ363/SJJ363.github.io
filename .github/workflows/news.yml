name: Refresh insurtech news

# The site publishes on a Central-time clock:
#   Mon–Fri  08:00, 13:00, 18:00 CT   (the brief is written on the 08:00 run)
#   Sat–Sun  13:00 CT only            (the brief is written on that run)
#
# The cron itself carries none of that. It fires hourly and scripts/schedule.js
# decides which firing is a real slot, so ~21 of the 24 are no-ops that exit in
# seconds. Two reasons it is hourly rather than the six UTC hours the slots
# actually fall on:
#
#  1. GitHub's `schedule` is best-effort, and on this repo it is *reliably*
#     late — every scheduled run over the five days before 2026-07-27 landed
#     1h01m to 3h43m after its cron time, not one of them on time. Firing
#     hourly doesn't make a run punctual, but it shortens the wait between a
#     slot opening and some firing actually landing to serve it, since the gate
#     hands the slot to whichever run gets there first.
#  2. It makes DST a non-issue. A slot-specific cron would have to list each
#     slot at both its CDT (UTC−5) and CST (UTC−6) hour and would still be
#     wrong for the fortnight when the US and EU offsets disagree.
#
# If the wire ever needs to land *punctually*, cron is the wrong tool: an
# external trigger calling the workflow_dispatch API skips this queue entirely.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      brief:
        description: "Daily brief on this run"
        type: choice
        options: [auto, force, skip]
        default: auto

permissions:
  contents: write

# NOTE: the site-write concurrency group is held by the `refresh` job below, not
# by the workflow. The gate can sit on its runner for up to ~100 minutes waiting
# out an imminent slot, and holding a write lock that whole time would stall
# brief-retry.yml and backfill.yml behind a job that writes nothing.

jobs:
  # Which firings are real slots — and does today still need its brief? Decided
  # from the committed data/news.json, so a slot whose run failed or was skipped
  # by GitHub is picked up by the next firing instead of being lost. A manual
  # dispatch always runs. `--wait` lets a firing that lands shortly before a slot
  # hold its runner and serve the slot on time rather than hand it back to
  # GitHub's queue, which may not come round again for hours.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # the hold is capped well under this; a stuck gate isn't free
    outputs:
      run: ${{ steps.plan.outputs.run }}
      brief: ${{ steps.plan.outputs.brief }}
      date: ${{ steps.plan.outputs.date }}
      slot: ${{ steps.plan.outputs.slot }}
    steps:
      # The tip, not the triggering SHA: the whole decision is "has the
      # published wire served this slot yet", so it has to read what is
      # actually published. See the note on the refresh checkout below.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Plan this run
        id: plan
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          FORCE_BRIEF: ${{ inputs.brief }}
        run: node scripts/schedule.js --wait

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Shared with brief-retry.yml and backfill.yml, deliberately: all three
    # commit data/ and the generated pages, so two in flight means the loser's
    # push is rejected and that run's work is dropped. The group name is the
    # resource, not the workflow.
    concurrency:
      group: site-write
      cancel-in-progress: false
    steps:
      # `ref` is load-bearing, and the lock above is what makes it so. By
      # default actions/checkout takes github.sha — the commit that *triggered*
      # the run — while this job by design starts only once whoever held
      # site-write has finished, i.e. after they pushed. So the default hands
      # the second writer a base it is already behind, its push is rejected as
      # a non-fast-forward, and the run fails having thrown its work away.
      # Checking out the tip of the branch instead is what completes the lock:
      # serialised writers that each build on the previous one's commit.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Re-decide, now that we hold the lock and have the real tip.
      #
      # The gate may have held its runner up to 100 minutes for this slot
      # (3b-iii), and GitHub delivers firings in waves — so two firings can
      # both land inside that window and wake within seconds of each other,
      # too close for either's refetchWire() to see the other. That happened
      # on both 2026-07-28 and 2026-07-29 at the 18:00 CT slot. The gate
      # cannot resolve it, because at wake time neither run has published
      # anything yet; here, one of them has.
      #
      # Bare schedule.js, no --wait: same code as the gate, so the two can't
      # drift, and a dispatch still forces through on FORCE_RUN. Cheap, and it
      # is also the honest answer for the log — a duplicate exits saying the
      # slot was already served rather than rebuilding the same site.
      #
      # Everything below hangs off this rather than off the gate: on the
      # morning slot both runs' gates say the brief is due, and without the
      # recheck the loser would spend a second day's brief budget rewriting
      # prose the winner already published.
      - name: Still needed?
        id: plan
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          FORCE_BRIEF: ${{ inputs.brief }}
        run: node scripts/schedule.js

      # KEEP_BRIEF carries the day's brief across the two later weekday
      # refreshes. fetch-news.js always builds a deterministic briefing, so
      # without it the 13:00 and 18:00 runs would silently replace Claude's
      # prose with a stand-in — a downgrade nobody asked for and nobody sees
      # until it is on the homepage.
      - name: Fetch latest news
        if: steps.plan.outputs.run == 'true'
        env:
          KEEP_BRIEF: ${{ steps.plan.outputs.brief == 'true' && '0' || '1' }}
          BRIEF_DATE: ${{ steps.plan.outputs.date }}
        run: node scripts/fetch-news.js

      # Install the Claude CLI once (used by both company extraction and the
      # brief). Authenticated by a Claude subscription via the OAuth token —
      # no metered API key. Skipped cleanly when the secret isn't set.
      - name: Install Claude CLI
        if: steps.plan.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN secret set — Claude steps will fall back."
          else
            npm install -g @anthropic-ai/claude-code
          fi

      # The brief runs FIRST, before company extraction, because the two share
      # one subscription budget and only one of them is original writing. On
      # 2026-07-26 the extractor spent the last of the session quota one second
      # before the brief asked for it; the brief now gets first claim, and the
      # extractor degrades to heuristics — which nobody reads as prose.
      #
      # Once a day, on the first slot of the day: 08:00 CT on weekdays, 13:00
      # CT at weekends. The gate hangs this off the *date* rather than the slot,
      # so if the 08:00 run never happened the 13:00 one writes the brief.
      #
      # Fail-safe by design: the script walks a ladder (CLI → other models →
      # wait out a short limit → the metered API → today's earlier Claude
      # brief) and only then keeps the deterministic one, stamping a
      # retryAfter that brief-retry.yml picks up.
      - name: Write brief with Claude
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.brief == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Separate quota from the subscription — the rung that survives a
          # session limit. Optional; the ladder just ends a step earlier without it.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No Claude credentials set — keeping deterministic brief."
            exit 0
          fi
          node scripts/write-brief.js || echo "Brief writer crashed — keeping deterministic brief."

      # Extract companies with Claude (heuristic fallback), tag each article,
      # and update the persistent company index (accumulates across batches).
      - name: Update company index
        if: steps.plan.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/companies.js || echo "Company index step failed — keeping previous."

      # Read the funding round out of each candidate headline — amount,
      # currency, stage, lead, and whether it is a round at all. Cached per
      # link in the same store, so this is a handful of calls on a normal
      # run and only re-reads the archive when the prompt version changes.
      #
      # Third of the four Claude steps. The brief is the page nobody else
      # wrote, the company index feeds every page on the site, and this one
      # degrades to the regexes in funding.js — which is a thinner tracker
      # for a run, not a broken one. Same shared subscription budget, so
      # the order is the priority order.
      - name: Extract funding rounds
        if: steps.plan.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/funding-extract.js || echo "Funding extraction failed — regex fallback stands."

      # Write the short factual profile that leads each company page —
      # the only original sentence on the site's biggest page type.
      # Cached per slug, rewritten only when the company gains newer
      # coverage, so a normal run is ~one call and a prompt-version bump
      # is a full backfill.
      #
      # LAST of the four Claude steps, because it has the softest failure
      # of any of them: no profile means the page renders exactly as it
      # did before this step existed. It also self-gates — nothing
      # downstream needs a profile to exist.
      #
      # --limit is what keeps a backfill from becoming an outage. Unbounded,
      # the first run after this shipped (or after any PROMPT_VERSION bump)
      # would ask for ~1,300 profiles in one job: ~111 CLI calls, most of a
      # day's session budget, and a job that runs long enough to collide
      # with the next scheduled refresh — all to fill a cache that has no
      # deadline. At 120 per run the archive fills over ~11 runs, roughly
      # four days at three slots a day, while the steady state (~15 a day,
      # rule 3a-ii) still clears in a single run every time. The cap is
      # per run, not per day, and the script does the most-covered
      # companies first, so the pages that matter get theirs on run one.
      - name: Write company profiles
        if: steps.plan.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/profile.js --limit 120 || echo "Profile writer failed — pages render without a profile."

      # Write the standing explainer at the top of each topic hub — the
      # last page type here that carried no sentence anybody wrote, and
      # the one pointed at evergreen definitional queries ("what is
      # embedded insurance") rather than at this week's news.
      #
      # LAST of the five Claude steps, on the same reasoning that put
      # profile.js fourth: no brief means the hub renders exactly as it
      # did before this step existed, and nothing downstream needs one.
      #
      # No --limit, unlike every other step here, because there is
      # nothing to bound. There are fourteen hubs and one call each, so a
      # full rebuild after a PROMPT_VERSION bump is fourteen calls — and
      # a normal day is zero, since a brief is only rewritten once its
      # topic has grown materially (rule 3d-i), not whenever it gains a
      # story. Every hub gains stories daily; none of them changes what
      # the subject *is* daily.
      - name: Write topic briefs
        if: steps.plan.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/topic-brief.js || echo "Topic brief writer failed — hubs render without a brief."

      # Last, and the cheapest step here by some distance: a definition is
      # written once and never refreshed on growth, since what a term means
      # does not change when eleven more headlines mention it. Steady state
      # is zero calls — this fires only for a term newly over the coverage
      # floor, or after a TERMS/prompt change. Softest failure of the six
      # too: no definition simply means no page, and nothing that already
      # existed is removed.
      - name: Write glossary definitions
        if: steps.plan.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/glossary-write.js || echo "Glossary writer failed — unwritten terms get no page."

      # Only exists when the enhancement fell back. Holds the raw model reply
      # and the guard that rejected it — the evidence that shouldn't ship to
      # the site. The short reason code is also committed into news.json.
      - name: Upload brief fallback diagnostics
        if: always() && steps.plan.outputs.run == 'true' && steps.plan.outputs.brief == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: brief-fallback-${{ github.run_number }}
          path: brief-fallback.json
          if-no-files-found: ignore
          retention-days: 30

      # Regenerate all SEO artifacts from the refreshed data: static
      # per-company pages, the day's brief page (folded into the
      # permanent archive under /brief/), sitemap.xml, robots.txt, and
      # the structured data injected into index.html / companies.html.
      - name: Build SEO (pages, sitemap, structured data)
        if: steps.plan.outputs.run == 'true'
        run: node scripts/seo.js

      - name: Commit if changed
        id: commit
        if: steps.plan.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Every directory seo.js writes has to be listed here — a generated
          # page missing from this pathspec is regenerated on every run, left
          # dirty in the runner and never pushed, so the live page silently
          # freezes while sitemap.xml keeps advertising it as fresh. `funding/`
          # covers the month pages too, once collectMonths() starts returning any.
          git add -A data/ company/ brief/ topic/ funding/ glossary/ market/ about/ sitemap.xml robots.txt feed.xml funding-feed.xml funding.csv funding.json index.html companies.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh insurtech news (${{ steps.plan.outputs.slot }} CT ${{ steps.plan.outputs.date }})"
            git push
            echo "News + SEO updated and pushed."
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to publish."
          fi

      # Tell the engines that support IndexNow what just changed, instead
      # of waiting for them to re-crawl 925 sitemap URLs and find out. Runs
      # only after a push actually landed, reads the changed set out of that
      # commit, and never fails the run — the site is already live by here.
      # Google does not participate; Bing, Yandex, Seznam and Naver do.
      - name: Ping IndexNow
        if: steps.commit.outputs.pushed == 'true'
        run: node scripts/indexnow.js

      # Mail the day's brief to Kit subscribers (rule 10). Last step of
      # the job, and after the push for a reason: the mail links to
      # /brief/<date>/, so sending earlier would deliver a link to a
      # page that isn't live yet. Kit itself records what has already
      # gone out — this step keeps no local state, because anything it
      # wrote here would land after `Commit if changed` and never be
      # pushed. Fails soft: the site is already published by here, so a
      # refused broadcast must not turn a good publish into a red run.
      - name: Email the brief
        if: steps.commit.outputs.pushed == 'true'
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: node scripts/kit-send.js
