name: Refresh insurtech news

# The site publishes on a Central-time clock:
#   Mon–Fri  08:00, 13:00, 18:00 CT   (the brief is written on the 08:00 run)
#   Sat–Sun  13:00 CT only            (the brief is written on that run)
#
# The cron itself carries none of that. It fires hourly and scripts/schedule.js
# decides which firing is a real slot, so ~21 of the 24 are no-ops that exit in
# seconds. Two reasons it is hourly rather than the six UTC hours the slots
# actually fall on:
#
#  1. GitHub's `schedule` is best-effort, and on this repo it is *reliably*
#     late — every scheduled run over the five days before 2026-07-27 landed
#     1h01m to 3h43m after its cron time, not one of them on time. Firing
#     hourly doesn't make a run punctual, but it shortens the wait between a
#     slot opening and some firing actually landing to serve it, since the gate
#     hands the slot to whichever run gets there first.
#  2. It makes DST a non-issue. A slot-specific cron would have to list each
#     slot at both its CDT (UTC−5) and CST (UTC−6) hour and would still be
#     wrong for the fortnight when the US and EU offsets disagree.
#
# If the wire ever needs to land *punctually*, cron is the wrong tool: an
# external trigger calling the workflow_dispatch API skips this queue entirely.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      brief:
        description: "Daily brief on this run"
        type: choice
        options: [auto, force, skip]
        default: auto

permissions:
  contents: write

# Shared with backfill.yml, deliberately: both commit data/ and the generated
# pages, so two of them in flight means the loser's push is rejected and that
# run's work is dropped. The group name is the resource, not the workflow.
concurrency:
  group: site-write
  cancel-in-progress: false

jobs:
  # Which of the six daily firings is a real slot — and does today still need
  # its brief? Decided from the committed data/news.json, so a slot whose run
  # failed or was skipped by GitHub is picked up by the next firing instead of
  # being lost. A manual dispatch always runs.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
      brief: ${{ steps.plan.outputs.brief }}
      date: ${{ steps.plan.outputs.date }}
      slot: ${{ steps.plan.outputs.slot }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Plan this run
        id: plan
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          FORCE_BRIEF: ${{ inputs.brief }}
        run: node scripts/schedule.js

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # KEEP_BRIEF carries the day's brief across the two later weekday
      # refreshes. fetch-news.js always builds a deterministic briefing, so
      # without it the 13:00 and 18:00 runs would silently replace Claude's
      # prose with a stand-in — a downgrade nobody asked for and nobody sees
      # until it is on the homepage.
      - name: Fetch latest news
        env:
          KEEP_BRIEF: ${{ needs.gate.outputs.brief == 'true' && '0' || '1' }}
          BRIEF_DATE: ${{ needs.gate.outputs.date }}
        run: node scripts/fetch-news.js

      # Install the Claude CLI once (used by both company extraction and the
      # brief). Authenticated by a Claude subscription via the OAuth token —
      # no metered API key. Skipped cleanly when the secret isn't set.
      - name: Install Claude CLI
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN secret set — Claude steps will fall back."
          else
            npm install -g @anthropic-ai/claude-code
          fi

      # The brief runs FIRST, before company extraction, because the two share
      # one subscription budget and only one of them is original writing. On
      # 2026-07-26 the extractor spent the last of the session quota one second
      # before the brief asked for it; the brief now gets first claim, and the
      # extractor degrades to heuristics — which nobody reads as prose.
      #
      # Once a day, on the first slot of the day: 08:00 CT on weekdays, 13:00
      # CT at weekends. The gate hangs this off the *date* rather than the slot,
      # so if the 08:00 run never happened the 13:00 one writes the brief.
      #
      # Fail-safe by design: the script walks a ladder (CLI → other models →
      # wait out a short limit → the metered API → today's earlier Claude
      # brief) and only then keeps the deterministic one, stamping a
      # retryAfter that brief-retry.yml picks up.
      - name: Write brief with Claude
        if: needs.gate.outputs.brief == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Separate quota from the subscription — the rung that survives a
          # session limit. Optional; the ladder just ends a step earlier without it.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No Claude credentials set — keeping deterministic brief."
            exit 0
          fi
          node scripts/write-brief.js || echo "Brief writer crashed — keeping deterministic brief."

      # Extract companies with Claude (heuristic fallback), tag each article,
      # and update the persistent company index (accumulates across batches).
      - name: Update company index
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/companies.js || echo "Company index step failed — keeping previous."

      # Only exists when the enhancement fell back. Holds the raw model reply
      # and the guard that rejected it — the evidence that shouldn't ship to
      # the site. The short reason code is also committed into news.json.
      - name: Upload brief fallback diagnostics
        if: always() && needs.gate.outputs.brief == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: brief-fallback-${{ github.run_number }}
          path: brief-fallback.json
          if-no-files-found: ignore
          retention-days: 30

      # Regenerate all SEO artifacts from the refreshed data: static
      # per-company pages, the day's brief page (folded into the
      # permanent archive under /brief/), sitemap.xml, robots.txt, and
      # the structured data injected into index.html / companies.html.
      - name: Build SEO (pages, sitemap, structured data)
        run: node scripts/seo.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Every directory seo.js writes has to be listed here — a generated
          # page missing from this pathspec is regenerated on every run, left
          # dirty in the runner and never pushed, so the live page silently
          # freezes while sitemap.xml keeps advertising it as fresh. `funding/`
          # covers the month pages too, once collectMonths() starts returning any.
          git add -A data/ company/ brief/ topic/ funding/ sitemap.xml robots.txt index.html companies.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh insurtech news (${{ needs.gate.outputs.slot }} CT ${{ needs.gate.outputs.date }})"
            git push
            echo "News + SEO updated and pushed."
          else
            echo "No changes to publish."
          fi
