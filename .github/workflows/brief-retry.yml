name: Retry Claude brief

# The last line of defence. When a run falls back to the deterministic brief
# because the Claude budget was exhausted, the limit resets on a clock — often
# hours later, long after that run has finished. This workflow comes back for
# it, so a fallback is a delay rather than a published outcome.
#
# It is deliberately cheap: `write-brief.js --if-fallback` exits in
# milliseconds unless data/news.json actually carries a fallback whose
# `retryAfter` has passed, so most firings do nothing and commit nothing.

on:
  schedule:
    # Twice an hour, offset from the refresh slots so the two don't queue up.
    - cron: "20,50 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Shared with news.yml — these two must never push concurrently.
# Shared with news.yml and backfill.yml — see the note there. Every workflow
# that commits data/ and the generated pages takes the same lock.
concurrency:
  group: site-write
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      # The tip, not the triggering SHA. This job starts only once whoever held
      # site-write has finished — i.e. after they pushed — so the default
      # checkout would hand it a base it is already behind, and the push at the
      # end would be rejected as a non-fast-forward. Here that costs more than
      # a failed run: the brief this workflow just recovered is the only thing
      # standing between a fallback and a permanent gap in /brief/ (3b), and a
      # rejected push throws it away. It would also gate on a stale
      # news.json, so it could retry a brief a refresh has already replaced.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Cheap gate: skips the Claude CLI install entirely when nothing is owed.
      # scripts/schedule.js owns the answer so this and news.yml can't drift —
      # it emits `retry`, which is true only for a fallen-back brief belonging
      # to *today* (Central) whose retryAfter has passed. The date check is what
      # stops a limit that lifts after midnight from rewriting yesterday's brief
      # against a batch it was never about.
      - name: Is a retry due?
        id: gate
        run: node scripts/schedule.js

      - name: Install Claude CLI
        if: steps.gate.outputs.retry == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            npm install -g @anthropic-ai/claude-code
          fi

      # Re-runs the full ladder against the batch already in data/news.json.
      # No refetch: the goal is to replace this batch's brief, not to build a
      # new one from stories the site has since moved past.
      - name: Retry the brief
        if: steps.gate.outputs.retry == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/write-brief.js --if-fallback || echo "Retry failed — deterministic brief stands."

      - name: Upload brief fallback diagnostics
        if: always() && steps.gate.outputs.retry == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: brief-retry-${{ github.run_number }}
          path: brief-fallback.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Build SEO (pages, sitemap, structured data)
        if: steps.gate.outputs.retry == 'true'
        run: node scripts/seo.js

      - name: Commit if changed
        if: steps.gate.outputs.retry == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Kept identical to news.yml's pathspec — this workflow runs the same
          # seo.js build, so anything missing here freezes the same way.
          git add -A data/ company/ brief/ topic/ funding/ glossary/ sitemap.xml robots.txt index.html companies.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: rewrite brief with Claude ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
            echo "Brief recovered and pushed."
          else
            echo "No changes to publish."
          fi
